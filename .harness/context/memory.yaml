# AI 记忆/规则索引
# 用于快速查找项目规则和知识

version: "2.0"
last_updated: "2026-04-24"

# L1 核心约束（始终加载）
l1_core:
  path: ".harness/AGENTS.md"
  description: "核心约束，≤10条，所有任务前必读"
  key_points:
    - "任务超过 30 分钟必须分解"
    - "修改公共 API / 引入依赖 / 删 >50 行代码需确认"
    - "禁止提交 main、执行 rm -rf、访问敏感配置"
    - "沙箱: 1 CPU / 512MB / 30s 超时 / 无网络"
    - "API Key 禁止硬编码"
    - "MVP 1周约束: P0 必须完成，每天可运行"

# L2 领域规则（按需加载）
l2_rules:
  architecture:
    path: ".harness/rules/architecture.md"
    description: "技术栈、目录结构、模块边界"

  api_design:
    path: ".harness/rules/api-design.md"
    description: "REST 路由命名、WebSocket 规范、版本控制"

  database:
    path: ".harness/rules/database.md"
    description: "SQLite 存储策略、表结构、迁移规则"

  testing:
    path: ".harness/rules/testing.md"
    description: "测试结构、命名、覆盖要求"

  security:
    path: ".harness/rules/security.md"
    description: "沙箱参数、敏感信息、禁止事项"

# L3 指南与示例（手动参考）
l3_guides:
  error_handling:
    path: ".harness/guides/error-handling.md"
    description: "错误处理优先级与取舍"

  performance:
    path: ".harness/guides/performance.md"
    description: "性能优化指南（正式版前必读）"

  patterns:
    path: ".harness/guides/patterns/"
    description: "代码模式示例（repository.py, service.py, unit-test.py）"

# 命令定义
commands:
  validate:
    path: ".harness/commands/validate.md"
    description: "/validate — 运行 lint、类型检查、测试"

  plan:
    path: ".harness/commands/plan.md"
    description: "/plan — 为复杂任务生成执行计划"

  review:
    path: ".harness/commands/review.md"
    description: "/review — 审查当前变更"

# 验证脚本
scripts:
  pre_validate:
    path: ".harness/scripts/pre-validate"
    description: "提交前快速验证（API Key 检查等）"

  validate:
    path: ".harness/scripts/validate.py"
    description: "主验证管道（ruff + mypy + pytest + 安全扫描）"

  lint_deps:
    path: ".harness/scripts/lint-deps.py"
    description: "依赖方向检查（防止循环依赖）"

# Git hooks
hooks:
  pre_commit:
    path: ".harness/hooks/pre-commit"
    description: "Git pre-commit hook（调用 pre-validate）"

# 动态上下文（AI 可写入）
context:
  decisions:
    path: ".harness/context/decisions.md"
    description: "架构决策记录（ADR）"

# 快捷命令参考
quick_commands:
  - name: "验证项目"
    cmd: "python .harness/scripts/validate.py"
    description: "运行完整项目验证"

  - name: "检查依赖方向"
    cmd: "python .harness/scripts/lint-deps.py"
    description: "检查模块依赖方向"

  - name: "查看核心规则"
    cmd: "cat .harness/AGENTS.md"
    description: "查看 L1 核心约束"

# AI 自检清单（每次任务前）
checklist:
  - "是否已阅读 AGENTS.md（L1 核心约束）？"
  - "任务是否超过 30 分钟或涉及 >3 个文件？若是，必须分解"
  - "是否标记了需要人类确认的点（API 变更、新依赖、删代码）？"
  - "是否检查了安全约束（无硬编码密钥、沙箱参数）？"

# 版本历史
changelog:
  - version: "2.0"
    date: "2026-04-24"
    changes:
      - "重构为三层规则框架（L1/L2/L3）"
      - "合并旧 5 个规则文件为新的分层结构"
      - "新增 commands/, scripts/, guides/patterns/"

  - version: "1.0"
    date: "2026-04-24"
    changes:
      - "初始化 Harness 规则框架"
